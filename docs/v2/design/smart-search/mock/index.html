*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink)}
body{margin:0;font:var(--t-body);background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:var(--focus-ring);outline-offset:var(--focus-offset)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- mock controls: not part of the design ---- */
.mock-bar{position:sticky;top:0;z-index:var(--z-menu);background:var(--surface-2);border-bottom:var(--b-hairline);padding:var(--s-3) var(--margin);display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-6);align-items:center;font:var(--t-label)}
.mock-bar label{display:flex;gap:var(--s-2);align-items:center;color:var(--muted)}
.mock-bar select,.mock-bar button{font:var(--t-label);background:var(--surface);color:var(--ink);border:var(--b-control);border-radius:var(--r-2);padding:6px 10px;min-height:32px}
.mock-bar .tag{margin-left:auto;color:var(--accent-text);font:var(--t-cap);letter-spacing:var(--t-cap-tracking);text-transform:uppercase}
.wrap{max-width:var(--max-content);margin:0 auto;padding:var(--s-8) var(--margin) var(--s-16)}
.frame{margin-bottom:var(--s-12)}
.frame>h2{font:var(--t-cap);letter-spacing:var(--t-cap-tracking);text-transform:uppercase;color:var(--muted);margin:0 0 var(--s-3)}
.frame>h2 b{color:var(--accent-text);font-weight:600}
.note{font:var(--t-small);color:var(--muted);max-width:70ch;margin:var(--s-3) 0 0}
.screen{position:relative;border:var(--b-hairline);border-radius:var(--r-4);overflow:hidden;background:var(--bg);box-shadow:var(--e-1)}

/* ---- site header ---- */
.hdr{background:var(--header);color:var(--header-ink);display:flex;align-items:center;gap:var(--s-6);padding:0 var(--s-6);min-height:var(--header-h)}
.brand{font:var(--t-sign);letter-spacing:var(--t-sign-tracking);text-transform:uppercase}
.hdr nav{display:flex;gap:var(--s-5);font:var(--t-tab);color:var(--header-mute)}
.hdr nav .cur{color:var(--header-ink);font-weight:var(--t-tab-current-weight)}
.searchbox{position:relative;margin-left:auto;width:min(560px,100%)}
.input{display:flex;align-items:center;gap:var(--s-2);background:var(--header-2);border:1px solid var(--header-line);border-radius:var(--r-3);padding:0 var(--s-3);min-height:40px;color:var(--header-ink);font:var(--t-small)}
.input svg{flex:none;opacity:.8}
.input span.q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input .caret{width:1px;height:18px;background:var(--header-ink);margin-left:-4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---- the dropdown ---- */
.drop{position:absolute;right:0;left:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border-radius:var(--r-4);box-shadow:var(--e-2);padding:var(--s-4);z-index:var(--z-menu)}
.readas{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}
.lbl{font:var(--t-cap);letter-spacing:var(--t-cap-tracking);text-transform:uppercase;color:var(--muted);margin-right:var(--s-1)}
.chip{display:inline-flex;align-items:stretch;border:var(--b-control);border-radius:var(--r-full);background:var(--surface);font:var(--t-chip);min-height:28px;overflow:hidden;transition:opacity .16s ease,transform .16s ease,max-width .2s ease,margin .2s ease;max-width:560px;animation:rise .18s ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.chip.out{opacity:0;max-width:0;margin-left:-8px;border-width:0;transform:scale(.9)}
.chip .t{display:inline-flex;align-items:center;padding:0 var(--s-3);background:none;border:0;border-radius:0;font:inherit;min-height:28px}
.chip .t:hover{background:var(--surface-2)}
.chip .x{display:inline-grid;place-items:center;width:28px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);font-size:15px;line-height:1}
.chip .x:hover{background:var(--crit-soft);color:var(--crit)}
.chip.implied{border-style:dashed;color:var(--muted)}
.chip.ask{border-style:dashed;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip .t .sub{color:var(--muted);margin-left:6px}
.pop{margin-top:var(--s-3);padding:var(--s-3);border:var(--b-hairline);border-radius:var(--r-3);background:var(--surface-2);display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;font:var(--t-label)}
.pop button{border:var(--b-control);background:var(--surface);border-radius:var(--r-full);padding:4px 12px;min-height:28px;font:var(--t-chip)}
.pop button:hover{border-color:var(--accent);background:var(--accent-soft)}
.notused{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-top:var(--s-3);font:var(--t-label);color:var(--muted)}
.w{border:1px dashed var(--line-2);border-radius:var(--r-2);padding:2px 8px;color:var(--ink-2);font:var(--t-chip)}
.w.yet{border-style:solid;background:var(--info-soft);color:var(--info);border-color:transparent}
.showrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin-top:var(--s-4);padding:var(--s-3) var(--s-4);border-radius:var(--r-3);background:var(--accent);color:var(--accent-ink);font:var(--t-title);border:0;width:100%;text-align:left}
.showrow:hover{background:var(--accent-hover)}
.showrow small{font:var(--t-label)}
.dym{margin-top:var(--s-3);font:var(--t-small);color:var(--ink-2)}
.dym a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;margin-left:6px;font-weight:600}
.names{margin-top:var(--s-4);border-top:var(--b-hairline);padding-top:var(--s-3);display:grid;gap:2px}
.names .g{font:var(--t-cap);letter-spacing:var(--t-cap-tracking);text-transform:uppercase;color:var(--muted);margin:var(--s-2) 0 2px}
.names div.r{display:flex;justify-content:space-between;padding:6px var(--s-2);border-radius:var(--r-2);font:var(--t-title)}
.names div.r span{font:var(--t-meta);color:var(--muted)}
.names div.r:hover{background:var(--surface-2)}
.empty-dd{margin-top:var(--s-3);font:var(--t-small);color:var(--muted)}

/* ---- the Places page ---- */
.page{padding:var(--s-6)}
.page h1{font:var(--t-page);font-size:56px;margin:0 0 var(--s-4);text-transform:uppercase}
.sb{display:flex;align-items:center;gap:var(--s-3);background:var(--surface);border:var(--b-control);border-radius:var(--r-3);padding:0 var(--s-3);min-height:44px;font:var(--t-small)}

    <div class="screen" style="${dropMinHeight()}">${header()}</div>
    <p class="note">Each chip has its own remove control (28 px wide on desktop, 36 px on a phone). A chip with a small arrow opens the other readings. A dashed chip is a question, not a filter. A chip marked "needed" was added because another chip needs it. Try removing a chip: the keys under the list drop and the count says it is recounting.</p></section>
  <section class="frame"><h2><b>B</b> &nbsp;Places list after Enter <span style="text-transform:none;letter-spacing:0">&middot; the parse is in the normal filter bar, with a one-line undo</span></h2>
    <div class="screen">${page()}</div>
    <p class="note">Rows with no answer for a parsed constraint never count as a match. They sit in a collapsed group under the results, counted per constraint. Words with no filter are shown as "Not used" or "Not used yet", never dropped and never turned into a ranking.</p></section>
  <section class="frame"><h2><b>C</b> &nbsp;A name wins over a parse</h2>
    <div class="screen" style="min-height:300px">${nameWin()}</div>
    <p class="note">"Niagara Falls" is a place name, so it is not read as "waterfalls in Niagara". The name hits show as they do today.</p></section>`;
}
function bind() {
  $('#app').addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      const id = rm.dataset.rm;
      const el = rm.closest('.chip');
      el.classList.add('out');
      setTimeout(() => { state.removed.add(id); state.pop = null; render(); }, 180);
      return;
    }
    const pop = e.target.closest('[data-pop]');
    if (pop) { state.pop = state.pop === pop.dataset.pop ? null : pop.dataset.pop; render(); return; }
    if (e.target.closest('[data-unc]')) { state.unc = !state.unc; render(); }
  });
  DATA.forEach((d, i) => $('#pick').insertAdjacentHTML('beforeend', `<option value="${i}">${d.id}. ${esc(d.query)}</option>`));
  $('#pick').addEventListener('change', (e) => { state.i = +e.target.value; state.removed.clear(); state.pop = null; state.unc = false; render(); });
  $('#theme').addEventListener('change', (e) => { document.documentElement.dataset.theme = e.target.value; });
  $('#reset').addEventListener('click', () => { state.removed.clear(); state.pop = null; render(); });
}
const p = new URLSearchParams(location.search);
if (p.get('theme')) { document.documentElement.dataset.theme = p.get('theme'); $('#theme').value = p.get('theme'); }
if (p.get('q')) state.i = Math.max(0, DATA.findIndex((d) => String(d.id) === p.get('q')));
if (p.get('open')) state.unc = true;
bind();
$('#pick').value = state.i;
render();
</script>
</body>
</html>
