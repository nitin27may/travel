<!DOCTYPE html>
<!-- Template for locations/index.html. Reads the locations-view/1 contract (see PLAN-locations-g5.md 2.2). Built only by _system/tools/locations.py build. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locations: the list</title>
<meta name="description" content="Every place we want to go, grouped by country, region and area. Filter and search.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@450;600&display=swap" rel="stylesheet">
<style>
/*__SITE_CSS__*/
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 57px)}
#filters{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:calc(100vh - 57px);overflow:auto}
#filters>summary{display:none;list-style:none;cursor:pointer;padding:14px 20px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#filters>summary::-webkit-details-marker{display:none}
.rail{padding:22px 20px}
.rail section{margin-bottom:22px}
.rail h3{font-size:.8rem;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
main{padding:26px 32px 60px;min-width:0}
.summary{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.summary .count{font-family:var(--font-display);font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
.summary .what{color:var(--muted)}
.summary .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.group-country{margin:28px 0 10px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.group-country .n{font-family:var(--font-mono);font-size:.72rem;color:var(--muted-2)}
.group-region{margin:18px 0 6px;color:var(--ink-2)}
.group-area{margin:12px 0 8px;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.collections{margin-top:40px}
.stat{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  #filters{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #filters>summary{display:block}
  main{padding:20px}
  .summary .actions{margin-left:0}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../">Trip plans</a>
  <nav><a href="../">Trips</a><a class="on" href="./" aria-current="page">Locations</a><a href="../globe/">Globe</a></nav>
  <span class="spacer"></span>
  <span class="built">built __BUILT__</span>
</header>

<div class="layout">
<details id="filters" open>
<summary id="filtersSum">Filters</summary>
<div class="rail" aria-label="Filters">
  <section>
    <h3>Search</h3>
    <input id="q" type="search" placeholder="name, area, tag, note" autocomplete="off" aria-label="Search places">
  </section>
  <section>
    <h3>Country</h3>
    <div class="chips" id="countries"></div>
  </section>
  <section id="regionSec" hidden>
    <h3>Region</h3>
    <select id="region" aria-label="Region"><option value="">All regions</option></select>
  </section>
  <section id="areaSec" hidden>
    <h3>Area</h3>
    <select id="area" aria-label="Area"><option value="">All areas</option></select>
  </section>
  <section>
    <h3>Kind</h3>
    <div class="chips" id="kinds"></div>
  </section>
  <section>
    <h3>Status</h3>
    <div class="chips" id="statuses"></div>
  </section>
  <section>
    <h3>Kids</h3>
    <div class="chips" id="kids"></div>
  </section>
  <section>
    <h3>Tags</h3>
    <div class="chips" id="tags"></div>
    <p style="margin-top:8px"><button type="button" id="allTags" aria-pressed="false" hidden>Show all tags</button></p>
  </section>
  <section>
    <button type="button" id="clear">Clear filters</button>
  </section>
</div>
</details>

<main>
  <p class="eyebrow">Locations</p>
  <h1>The list</h1>
  <div class="summary">
    <span aria-live="polite" role="status" style="display:contents"><span class="count" id="count">0</span><span class="what" id="what">places</span></span>
    <span class="actions">
      <span class="seg" role="group" aria-label="Layout">
        <button type="button" id="vGrid" data-view="grid" aria-pressed="true">Grid</button>
        <button type="button" id="vList" data-view="list" aria-pressed="false">List</button>
      </span>
      <a class="btn" id="globeLink" href="../globe/">Open on the globe</a>
    </span>
  </div>
  <div class="active" id="active"></div>
  <div id="results"></div>
  <section class="collections" id="collections"></section>
</main>
</div>

<script id="site-data" type="application/json">__SITE_DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const P = DATA.places, C = DATA.collections || [], TAGS = DATA.tags || {}, CN = DATA.countries || {};
  const BYID = Object.fromEntries(P.map(p => [p.id, p]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
  const PREF_KEY = 'locations-prefs';
  const state = {q:'', country:'', region:'', area:'', kind:new Set(), status:new Set(), kid:'', tag:'',
                 ids:new Set(), label:'', view:'grid', focus:'', allTags:false};
  let viewInHash = false, scrolledFor = '', lastRows = [];

  // ---- saved layout preference; the hash wins ----
  function loadPrefs(){ try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify({view: state.view})); } catch (e) { /* private mode */ } }

  // ---- hash <-> state (shareable views) ----
  const csv = v => (v || '').split(',').filter(Boolean);
  function readHash(){
    const h = new URLSearchParams(location.hash.slice(1));
    state.q = h.get('q') || ''; state.country = (h.get('country') || '').toUpperCase(); state.region = h.get('region') || '';
    state.area = h.get('area') || ''; state.kid = h.get('kid') || ''; state.tag = h.get('tag') || '';
    state.kind = new Set(csv(h.get('kind'))); state.status = new Set(csv(h.get('status')));
    state.ids = new Set(csv(h.get('ids'))); state.label = h.get('label') || ''; state.focus = h.get('focus') || '';
    const hv = h.get('view');
    viewInHash = hv === 'grid' || hv === 'list';
    state.view = viewInHash ? hv : (loadPrefs().view === 'list' ? 'list' : 'grid');
  }
  function writeHash(){
    const h = new URLSearchParams();
    if (state.q) h.set('q', state.q);
    if (state.country) h.set('country', state.country);
    if (state.region) h.set('region', state.region);
    if (state.area) h.set('area', state.area);
    if (state.kind.size) h.set('kind', [...state.kind].join(','));
    if (state.status.size) h.set('status', [...state.status].join(','));
    if (state.kid) h.set('kid', state.kid);
    if (state.tag) h.set('tag', state.tag);
    if (state.ids.size) { h.set('ids', [...state.ids].join(',')); if (state.label) h.set('label', state.label); }
    if (state.view === 'list' || viewInHash) h.set('view', state.view);
    if (state.focus) h.set('focus', state.focus);
    const s = h.toString();
    history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
  }

  // region may come in as a code (QC), a name (Quebec) or an ISO 3166-2 code (CA-QC); area as slug or name
  const lc = s => String(s || '').toLowerCase();
  const regionMatch = (p, r) => !r || [p.region, p.region_name, p.region_iso].some(x => lc(x) === lc(r));
  const areaMatch = (p, a) => !a || lc(p.area) === lc(a) || lc(p.area_name) === lc(a);

  // ignore: the facet being counted, so a chip never leads to zero
  function matches(p, ignore){
    if (state.ids.size && !state.ids.has(p.id)) return false;
    if (ignore !== 'country' && state.country && p.country !== state.country) return false;
    if (ignore !== 'region' && !regionMatch(p, state.region)) return false;
    if (ignore !== 'area' && !areaMatch(p, state.area)) return false;
    if (ignore !== 'kind' && state.kind.size && !state.kind.has(p.kind)) return false;
    if (ignore !== 'status'){
      if (state.status.size){ if (!state.status.has(p.status)) return false; }
      else if (p.status === 'dropped') return false;   // dropped stays hidden unless its chip is on
    }
    if (ignore !== 'kid' && state.kid && (p.kid_fit || 'unknown') !== state.kid) return false;
    if (ignore !== 'tag' && state.tag && !(p.tags || []).includes(state.tag)) return false;
    if (state.q){
      const hay = lc([p.name, p.area_name, p.region_name, p.country_name, p.note, (p.tags || []).map(t => TAGS[t] || t).join(' '), p.kind].join(' '));
      if (!lc(state.q).split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  const tally = (arr, keys) => { const m = {}; arr.forEach(p => keys(p).forEach(k => m[k] = (m[k] || 0) + 1)); return m; };

  function chips(el, counts, isOn, onPick, labelOf){
    el.innerHTML = '';
    Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).forEach(([k, n]) => {
      const on = isOn(k);
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'chip'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.innerHTML = `${esc(labelOf ? labelOf(k) : k)} <span class="n">${n}</span>`;
      b.onclick = () => { onPick(k); change(); };
      el.appendChild(b);
    });
  }
  // a selected value that has no matches under the other filters still shows, so it can be turned off
  const withSelected = (counts, selected) => { selected.filter(Boolean).forEach(k => { if (!(k in counts)) counts[k] = 0; }); return counts; };

  function options(sel, rows, current, allLabel){
    sel.innerHTML = `<option value="">${allLabel}</option>` + rows.map(r => `<option value="${esc(r.v)}"${r.on ? ' selected' : ''}>${esc(r.l)} (${r.n})</option>`).join('');
  }
  const toggleIn = (set, k) => set.has(k) ? set.delete(k) : set.add(k);

  function change(){ state.focus = ''; update(); }

  function activeCount(){
    return (state.q ? 1 : 0) + (state.country ? 1 : 0) + (state.region ? 1 : 0) + (state.area ? 1 : 0) + state.kind.size + state.status.size
      + (state.kid ? 1 : 0) + (state.tag ? 1 : 0) + (state.ids.size ? 1 : 0);
  }

  function update(){
    writeHash();
    chips($('#countries'), withSelected(tally(P.filter(p => matches(p, 'country')), p => [p.country]), [state.country]), k => state.country === k,
          k => { state.country = state.country === k ? '' : k; state.region = ''; state.area = ''; }, k => CN[k] || k);

    $('#regionSec').hidden = !state.country;
    if (state.country){
      const rc = {};
      P.filter(p => matches(p, 'region') && p.country === state.country).forEach(p => { (rc[p.region] = rc[p.region] || {v:p.region, l:p.region_name, n:0, on:regionMatch(p, state.region) && !!state.region}).n++; });
      options($('#region'), Object.values(rc).sort((a, b) => a.l.localeCompare(b.l)), state.region, 'All regions');
    }
    $('#areaSec').hidden = !state.region;
    if (state.region){
      const ac = {};
      P.filter(p => matches(p, 'area') && regionMatch(p, state.region)).forEach(p => { (ac[p.area] = ac[p.area] || {v:p.area, l:p.area_name, n:0, on:areaMatch(p, state.area) && !!state.area}).n++; });
      options($('#area'), Object.values(ac).sort((a, b) => a.l.localeCompare(b.l)), state.area, 'All areas');
    }

    chips($('#kinds'), withSelected(tally(P.filter(p => matches(p, 'kind')), p => [p.kind]), [...state.kind]), k => state.kind.has(k), k => toggleIn(state.kind, k));
    // the dropped chip exists only when something is dropped
    chips($('#statuses'), withSelected(tally(P.filter(p => matches(p, 'status')), p => [p.status]), [...state.status]), k => state.status.has(k), k => toggleIn(state.status, k));
    chips($('#kids'), withSelected(tally(P.filter(p => matches(p, 'kid')), p => [p.kid_fit || 'unknown']), [state.kid]), k => state.kid === k, k => { state.kid = state.kid === k ? '' : k; });

    const tc = tally(P.filter(p => matches(p, 'tag')), p => p.tags || []);
    const sorted = Object.entries(tc).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const shown = state.allTags ? sorted : sorted.filter(([, n]) => n >= 2).slice(0, 40);
    const tshow = Object.fromEntries(shown);
    if (state.tag && !(state.tag in tshow)) tshow[state.tag] = tc[state.tag] || 0;
    chips($('#tags'), tshow, k => state.tag === k, k => { state.tag = state.tag === k ? '' : k; }, k => TAGS[k] || k);
    const hidden = sorted.length - shown.length;
    const tb = $('#allTags');
    tb.hidden = !(state.allTags || hidden > 0);
    tb.setAttribute('aria-pressed', state.allTags ? 'true' : 'false');
    tb.textContent = state.allTags ? 'Show top tags only' : `Show all tags (${sorted.length})`;

    const rows = P.filter(p => matches(p));
    lastRows = rows;
    $('#count').textContent = rows.length;
    $('#what').textContent = (rows.length === 1 ? 'place' : 'places') + (state.country ? ` in ${CN[state.country] || state.country}` : ' saved');

    const a3 = state.country ? (P.find(p => p.country === state.country) || {}).country_a3 : '';
    $('#globeLink').href = '../globe/' + (a3 ? '#c=' + encodeURIComponent(a3) : '');

    $('#vGrid').setAttribute('aria-pressed', state.view === 'grid' ? 'true' : 'false');
    $('#vList').setAttribute('aria-pressed', state.view === 'list' ? 'true' : 'false');
    const n = activeCount();
    $('#filtersSum').textContent = `Filters (${n} active)`;
    renderActive();
    renderResults(rows);
    renderCollections(rows);
    applyFocus();
  }

  function renderActive(){
    const el = $('#active'); el.innerHTML = '';
    if (!state.ids.size) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip from'; b.setAttribute('aria-pressed', 'true');
    b.setAttribute('aria-label', 'Remove filter: from the globe');
    b.innerHTML = `From the globe: ${esc(state.label || state.ids.size + ' places')} <span class="x" aria-hidden="true">&times;</span>`;
    b.onclick = () => { state.ids.clear(); state.label = ''; change(); };
    el.appendChild(b);
  }

  const seasonText = p => (p.season || []).join(' ');
  const mapUrl = p => p.lat != null ? `https://maps.google.com/?q=${p.lat},${p.lon}` : `https://maps.google.com/?q=${encodeURIComponent(p.name + ' ' + p.country_name)}`;
  const globeUrl = p => `../globe/#c=${encodeURIComponent(p.country_a3)}&p=${encodeURIComponent(p.id)}`;

  function linkList(p){
    const out = [];
    out.push(`<a href="${esc(mapUrl(p))}" target="_blank" rel="noopener">Map</a>`);
    if (p.wikidata) out.push(`<a href="https://www.wikidata.org/wiki/${esc(p.wikidata)}" target="_blank" rel="noopener">Wikidata</a>`);
    (p.links || []).forEach(s => { const u = safeUrl(s.url); if (u) out.push(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.type || 'source')}</a>`); });
    if (p.trip_url) out.push(`<a href="${esc(p.trip_url)}">Trip plan</a>`);
    if (p.lat != null) out.push(`<a href="${esc(globeUrl(p))}">Globe</a>`);
    return out;
  }

  function card(p){
    const stats = Object.entries(p.stats || {}).map(([k, v]) => `<span class="stat">${esc(k)} ${esc(v)}</span>`).join(' &middot; ');
    const img = /^https:\/\//.test(p.image || '') ? `<img class="thumb" loading="lazy" decoding="async" alt="" src="${esc(p.image + (p.image.includes('?') ? '&' : '?') + 'width=400')}">` : '';
    return `<article class="card" data-id="${esc(p.id)}">
      ${img}
      <h4>${esc(p.name)}</h4>
      <div class="meta"><span class="badge kind">${esc(p.kind)}</span><span class="badge status-${esc(p.status)}">${esc(p.status)}</span>${p.season && p.season.length ? `<span class="badge">${esc(seasonText(p))}</span>` : ''}${p.kid_fit && p.kid_fit !== 'unknown' ? `<span class="badge">kids: ${esc(p.kid_fit)}</span>` : ''}${p.location_status === 'unconfirmed' ? `<span class="badge unverified">location unconfirmed</span>` : ''}${stats && !p.stats_verified ? `<span class="badge unverified">unverified</span>` : ''}</div>
      ${stats ? `<div>${stats}</div>` : ''}
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
      ${(p.tags || []).length ? `<p class="stat">${p.tags.map(t => '#' + esc(TAGS[t] || t)).join(' ')}</p>` : ''}
      <div class="links">${linkList(p).join('')}</div>
      <div class="id">${esc(p.id)}</div>
    </article>`;
  }

  function row(p){
    const stats = Object.entries(p.stats || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(', ');
    return `<tr data-id="${esc(p.id)}">
      <td><strong>${esc(p.name)}</strong>${p.note ? `<div class="stat">${esc(p.note)}</div>` : ''}${stats ? `<div class="stat">${stats}${p.stats_verified ? '' : ' (unverified)'}</div>` : ''}</td>
      <td><span class="badge kind">${esc(p.kind)}</span></td>
      <td><span class="badge status-${esc(p.status)}">${esc(p.status)}</span></td>
      <td>${esc(p.area_name)}</td>
      <td>${esc(p.region_name)}</td>
      <td>${esc(seasonText(p)) || '<span class="stat">&ndash;</span>'}</td>
      <td>${esc(p.kid_fit && p.kid_fit !== 'unknown' ? p.kid_fit : '')}</td>
      <td><div class="lk">${linkList(p).join('')}</div></td>
    </tr>`;
  }

  const cmp = (a, b) => a.country_name.localeCompare(b.country_name) || a.region_name.localeCompare(b.region_name) || a.area_name.localeCompare(b.area_name) || a.name.localeCompare(b.name);

  function renderResults(rows){
    const el = $('#results');
    if (!rows.length){ el.innerHTML = `<div class="empty">Nothing matches. Clear a filter, or add the place: tell Claude "add X to the locations list".</div>`; return; }
    rows = rows.slice().sort(cmp);
    const perCountry = tally(rows, p => [p.country]);
    let html = '';
    if (state.view === 'list'){
      let cc = '';
      html = '<div class="tblwrap"><table class="tbl"><thead><tr><th>Name</th><th>Kind</th><th>Status</th><th>Area</th><th>Region</th><th>Season</th><th>Kids</th><th>Links</th></tr></thead><tbody>';
      for (const p of rows){
        if (p.country !== cc){ cc = p.country; html += `<tr class="grp"><td colspan="8"><h2 style="display:inline">${esc(p.country_name)}</h2> <span class="stat">${perCountry[cc]}</span></td></tr>`; }
        html += row(p);
      }
      html += '</tbody></table></div>';
    } else {
      let cc = '', rr = '', aa = '', open = false;
      for (const p of rows){
        if (p.country !== cc){ if (open) html += '</div>'; open = false; cc = p.country; rr = aa = ''; html += `<div class="group-country"><h2>${esc(p.country_name)}</h2><span class="n">${perCountry[cc]}</span></div>`; }
        if (p.region !== rr){ if (open) html += '</div>'; open = false; rr = p.region; aa = ''; html += `<h3 class="group-region">${esc(p.region_name)}</h3>`; }
        if (p.area !== aa){ if (open) html += '</div>'; aa = p.area; html += `<div class="group-area">${esc(p.area_name)}</div><div class="grid">`; open = true; }
        html += card(p);
      }
      if (open) html += '</div>';
    }
    el.innerHTML = html;
  }

  function renderCollections(rows){
    const vis = new Set(rows.map(p => p.id));
    const el = $('#collections');
    const cols = C.filter(c => (c.stops || []).some(id => vis.has(id)));
    if (!cols.length){ el.innerHTML = ''; return; }
    el.innerHTML = `<h2>Road trips and multi-stop ideas</h2>` + cols.map(c => {
      const first = (c.stops || []).map(id => BYID[id]).find(p => p && p.lat != null);
      const stops = c.stops.map(id => {
        const p = BYID[id];
        if (!p) return `<li class="off">${esc(id)}</li>`;
        return vis.has(id)
          ? `<li><button type="button" data-focus="${esc(id)}">${esc(p.name)}</button> <span class="stat">${esc(p.region_name)}</span></li>`
          : `<li class="off">${esc(p.name)} <span class="stat">${esc(p.region_name)}, hidden by filters</span></li>`;
      }).join('');
      const links = (c.links || []).map(s => ({t: s.type, u: safeUrl(s.url)})).filter(s => s.u).map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t || 'source')}</a>`);
      if (first) links.push(`<a href="${esc(globeUrl(first))}">Open first stop on the globe</a>`);
      return `<div class="card" style="margin-top:12px"><h4>${esc(c.name)}</h4>${c.notes ? `<p class="note">${esc(c.notes)}</p>` : ''}<ol class="stoplist">${stops}</ol>${links.length ? `<div class="links">${links.join('')}</div>` : ''}</div>`;
    }).join('');
  }

  // focus replaces in-page anchors, which would overwrite the filter hash
  function applyFocus(){
    document.querySelectorAll('.focus').forEach(e => e.classList.remove('focus'));
    if (!state.focus) { scrolledFor = ''; return; }
    const el = [...document.querySelectorAll('#results [data-id]')].find(e => e.dataset.id === state.focus);
    if (!el) return;
    el.classList.add('focus');
    if (scrolledFor !== state.focus){
      scrolledFor = state.focus;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({block:'center', behavior: reduce ? 'auto' : 'smooth'});
    }
  }

  function setView(v){
    state.view = v; viewInHash = true; savePrefs(); update();
  }

  $('#q').addEventListener('input', e => { state.q = e.target.value.trim(); change(); });
  $('#region').addEventListener('change', e => { state.region = e.target.value; state.area = ''; change(); });
  $('#area').addEventListener('change', e => { state.area = e.target.value; change(); });
  $('#allTags').addEventListener('click', () => { state.allTags = !state.allTags; update(); });
  $('#vGrid').addEventListener('click', () => setView('grid'));
  $('#vList').addEventListener('click', () => setView('list'));
  $('#clear').addEventListener('click', () => {
    Object.assign(state, {q:'', country:'', region:'', area:'', kid:'', tag:'', label:'', focus:''});
    state.kind.clear(); state.status.clear(); state.ids.clear(); $('#q').value = ''; update();
  });
  $('#collections').addEventListener('click', e => {
    const b = e.target.closest('button[data-focus]'); if (!b) return;
    state.focus = b.dataset.focus; scrolledFor = ''; update();
  });
  // a thumbnail that fails to load (offline, rate limit) just disappears
  $('#results').addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.remove(); }, true);
  window.addEventListener('hashchange', () => { readHash(); $('#q').value = state.q; update(); });

  // desktop: the rail is always open. Under 900px it collapses into the details element.
  const mq = window.matchMedia('(max-width: 900px)');
  const sync = () => { $('#filters').open = !mq.matches; };
  if (mq.addEventListener) mq.addEventListener('change', sync); else if (mq.addListener) mq.addListener(sync);
  $('#filtersSum').addEventListener('click', e => { if (!mq.matches) e.preventDefault(); });
  sync();

  window.__lst = () => ({
    count: lastRows.length, view: state.view,
    state: Object.assign({}, state, {kind: [...state.kind], status: [...state.status], ids: [...state.ids]})
  });

  readHash(); $('#q').value = state.q; update();
})();
</script>
</body>
</html>
