<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe: explore the world</title>
<meta name="description" content="Spin the earth, hover a country, click to drill into its states, districts and cities. Relief, oceans, rivers and mountains named.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@450;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230e6b6e'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d69329' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f1b15;--surface:#16261e;--surface-2:#1d3529;--line:#2f4a3b;--line-2:#3d5b4b;--ink:#e6ece8;--ink-2:#cfd8d2;--muted:#a9b8ae;--muted-2:#6f8579;--accent:#d69329;--accent-ink:#2a1e05;--teal:#0e6b6e;--teal-2:#2a9a9e;--font-display:"Big Shoulders Display",sans-serif;--font-body:"Source Serif 4",Georgia,serif;--font-mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.topbar{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);height:56px}
.topbar .brand{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1.25rem;color:var(--ink)}
.topbar nav{display:flex;gap:14px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.topbar nav a{color:var(--muted)}.topbar nav a.on{color:var(--accent)}
.topbar .spacer{flex:1}
.stage{position:relative;height:calc(100vh - 56px);display:grid;grid-template-columns:1fr 340px}
#map{position:relative;background:#06100c}
#crumbs{position:absolute;top:14px;left:14px;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;max-width:calc(100% - 28px)}
#crumbs a,#crumbs span.cur{background:rgba(15,27,21,.86);padding:6px 10px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;white-space:nowrap}
#crumbs a:hover{color:var(--accent);text-decoration:none;border-color:var(--accent)}
#crumbs span.cur{color:var(--accent);border-color:var(--accent);cursor:default}
#crumbs .sep{color:var(--muted-2)}
#tip{position:absolute;z-index:6;pointer-events:none;display:none;background:rgba(15,27,21,.94);border:1px solid var(--line-2);color:var(--ink);padding:9px 12px;border-radius:8px;font-size:.92rem;max-width:300px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#tip .k{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#tip b{font-size:1.05rem}
#tip .sub{color:var(--muted);font-size:.84rem;margin-top:2px}
#search{position:absolute;top:14px;left:0;right:0;margin:0 auto;z-index:7;width:min(440px,calc(100% - 420px))}
#search input{width:100%;font-family:var(--font-body);font-size:.98rem;padding:9px 14px 9px 38px;border-radius:999px;border:1px solid var(--line-2);background:rgba(15,27,21,.9);color:var(--ink);outline:none}
#search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(214,147,41,.18)}
#search::before{content:'';position:absolute;left:14px;top:12px;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;box-shadow:5px 5px 0 -3px var(--muted);pointer-events:none}
#results{position:absolute;top:44px;left:0;right:0;background:rgba(15,27,21,.97);border:1px solid var(--line-2);border-radius:10px;max-height:52vh;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#results .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#results .r:last-child{border-bottom:0}
#results .r:hover,#results .r.on{background:var(--surface-2)}
#results .r .n{color:var(--ink)}
#results .r .k{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
#results .r .k b{color:var(--accent);font-weight:600}
@media(max-width:900px){#search{width:calc(100% - 28px);top:58px}}
#hint{position:absolute;left:14px;bottom:30px;z-index:5;font-family:var(--font-mono);font-size:.68rem;color:var(--muted-2);background:rgba(15,27,21,.75);padding:5px 9px;border-radius:5px;max-width:60%}
#status{position:absolute;right:14px;top:14px;z-index:5;font-family:var(--font-mono);font-size:.68rem;color:var(--accent);background:rgba(15,27,21,.85);padding:6px 10px;border-radius:5px;display:none;border:1px solid var(--line-2)}
.maplibregl-ctrl-group{background:rgba(22,38,30,.95)!important;border:1px solid var(--line-2)!important;box-shadow:none!important}
.maplibregl-ctrl-group button{filter:invert(.85) sepia(.2) saturate(.6)}
.maplibregl-ctrl-attrib{font-family:var(--font-mono);font-size:10px!important;background:rgba(15,27,21,.75)!important;color:var(--muted)!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
#side{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:18px 18px 40px}
.eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#side h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:2rem;line-height:1;margin:4px 0 2px;word-break:break-word}
#side .sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.fact .l{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2)}
.fact .v{font-size:.98rem;color:var(--ink);margin-top:2px}
.fact.wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,.btn{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.ctl{display:flex;align-items:center;gap:10px;margin:6px 0 10px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
.ctl input[type=range]{flex:1;accent-color:var(--accent)}
.ctl output{color:var(--ink-2);min-width:34px;text-align:right}
.list{margin-top:8px}
.list .h{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin:14px 0 6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;cursor:pointer;background:var(--surface)}
.item:hover,.item.on{border-color:var(--accent)}
.item .n{color:var(--ink);font-size:.95rem}
.item .m{font-family:var(--font-mono);font-size:.64rem;color:var(--muted-2);white-space:nowrap}
.legend{font-family:var(--font-mono);font-size:.66rem;color:var(--muted-2);margin-top:18px;line-height:1.7}
.feat{background:var(--surface-2);border:1px solid var(--accent);border-radius:9px;padding:10px 12px;margin:0 0 12px;position:relative}
.feat .k{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.feat .n{font-size:1.1rem;color:var(--ink);font-weight:600;margin:2px 0}
.feat .m{color:var(--muted);font-size:.86rem}
.feat .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:1rem;padding:2px 6px;cursor:pointer}
.feat .x:hover{color:var(--accent)}
.feat .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
@media(max-width:900px){.stage{grid-template-columns:1fr;grid-template-rows:62vh 1fr}#side{border-left:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../">Trip plans</a>
  <nav><a href="../">Trips</a><a class="on" href="./">Globe</a></nav>
  <span class="spacer"></span>
</header>

<div class="stage">
  <div id="map">
    <div id="crumbs"></div>
    <div id="search"><input id="q" type="search" placeholder="Search a country, state, city, sea, range…" autocomplete="off" aria-label="Search places"><div id="results" role="listbox"></div></div>
    <div id="tip"></div>
    <div id="status"></div>
    <div id="hint">drag to spin · scroll to zoom · hover a country · click to fly in</div>
  </div>
  <aside id="side">
    <p class="eyebrow" id="eyebrow">Globe</p>
    <h2 id="title">The world</h2>
    <p class="sub" id="sub">Loading the earth…</p>
    <div class="row" id="actions"></div>
    <div id="feature"></div>
    <div class="facts" id="facts"></div>
    <div class="list" id="list"></div>
    <p class="legend" id="legend"></p>
  </aside>
</div>

<script type="module">
import * as maplibregl from './assets/vendor/maplibre-gl.mjs';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '–' : n >= 1e9 ? (n / 1e9).toFixed(2) + ' bn' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' m' : n.toLocaleString('en-CA');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
// OpenFreeMap styles: relief is the default; all share the same sources, so a switch keeps every tile already cached
const STYLES = { relief: 'https://tiles.openfreemap.org/styles/liberty', light: 'https://tiles.openfreemap.org/styles/positron', dark: 'https://tiles.openfreemap.org/styles/dark' };
const prefs = (() => { try { return JSON.parse(localStorage.getItem('globe-prefs') || '{}'); } catch (e) { return {}; } })();
const savePrefs = () => { try { localStorage.setItem('globe-prefs', JSON.stringify({ style: state.style, terrainOn: state.terrainOn, exag: state.exag })); } catch (e) {} };
const styleKey = STYLES[params.get('style')] ? params.get('style') : (STYLES[prefs.style] ? prefs.style : 'relief');
const STYLE = STYLES[styleKey];
const TERRAIN = 'https://tiles.mapterhorn.com/tilejson.json';
const TERRAIN_FALLBACK = { type: 'raster-dem', tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Terrain: Mapzen / AWS Terrain Tiles' };
const NE_ALIAS = { PSE: 'PSX', SSD: 'SDS', XKX: 'KOS' };   // ISO3 -> Natural Earth adm0_a3 where they differ
const PALETTE = ['#c9a66b', '#8fb3a1', '#a9b8d6', '#d6a79c', '#b7c48d', '#d3b7d8', '#9fc6c9', '#e0c48a'];
const EMPTY = { type: 'FeatureCollection', features: [] };

const [FACTS, WORLD, MANIFEST] = await Promise.all([
  fetch('assets/data/countries.json').then(r => r.json()),
  fetch('assets/data/countries-50m.json').then(r => r.json()),
  fetch('assets/admin/index.json').then(r => r.json()),
]);

// ---- geometry helpers (TopoJSON decode, bbox, centroid, point in polygon) ----
function topoFeatures(topo, obj){
  const { scale, translate } = topo.transform || { scale: [1, 1], translate: [0, 0] };
  const arcs = topo.arcs.map(arc => { let x = 0, y = 0; return arc.map(([dx, dy]) => { x += dx; y += dy; return [x * scale[0] + translate[0], y * scale[1] + translate[1]]; }); });
  const ring = idx => { const out = []; idx.forEach((i, k) => { let a = i < 0 ? arcs[~i].slice().reverse() : arcs[i]; if (k > 0) a = a.slice(1); out.push(...a); }); return out; };
  const geom = g => {
    if (!g) return null;
    if (g.type === 'Polygon') return { type: 'Polygon', coordinates: g.arcs.map(ring) };
    if (g.type === 'MultiPolygon') return { type: 'MultiPolygon', coordinates: g.arcs.map(p => p.map(ring)) };
    if (g.type === 'GeometryCollection') return { type: 'GeometryCollection', geometries: g.geometries.map(geom) };
    return null;
  };
  return { type: 'FeatureCollection', features: obj.geometries.map(g => ({ type: 'Feature', id: g.id, properties: g.properties || {}, geometry: geom(g) })) };
}
function eachPoint(f, cb){ const walk = c => Array.isArray(c[0]) ? c.forEach(walk) : cb(c); if (!f.geometry) return; if (f.geometry.type === 'GeometryCollection') f.geometry.geometries.forEach(g => walk(g.coordinates)); else walk(f.geometry.coordinates); }
function bbox(f){   // handles the antimeridian by preferring the narrower span
  let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180, minE = 360, maxE = 0;
  eachPoint(f, ([x, y]) => { minLat = Math.min(minLat, y); maxLat = Math.max(maxLat, y); minLon = Math.min(minLon, x); maxLon = Math.max(maxLon, x); const e = x < 0 ? x + 360 : x; minE = Math.min(minE, e); maxE = Math.max(maxE, e); });
  if (maxLon - minLon > 180 && maxE - minE < maxLon - minLon) return [[minE > 180 ? minE - 360 : minE, minLat], [maxE, maxLat]];
  return [[minLon, minLat], [maxLon, maxLat]];
}
function centroid(f){ let x = 0, y = 0, n = 0; const ring = f.geometry.type === 'Polygon' ? f.geometry.coordinates[0] : f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates.reduce((a, b) => a[0].length > b[0].length ? a : b)[0] : null; if (!ring) return null; for (const [px, py] of ring){ x += px; y += py; n++; } return [x / n, y / n]; }
function inRing(ring, [x, y]){ let inside = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){ const [xi, yi] = ring[i], [xj, yj] = ring[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; } return inside; }
function inFeature(f, pt){ const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : []; return polys.some(p => inRing(p[0], pt) && !p.slice(1).some(h => inRing(h, pt))); }

const countries = topoFeatures(WORLD, WORLD.objects.countries);
countries.features.forEach(f => { f.id = Number(f.id); f.properties.ccn3 = String(f.id).padStart(3, '0'); });
const byA3 = {}; Object.entries(FACTS).forEach(([ccn3, c]) => byA3[c.a3] = { ...c, ccn3 });
const countryOf = id => { const f = countries.features.find(x => x.id === id); return f ? (FACTS[f.properties.ccn3] || { name: f.properties.name, a3: null }) : null; };

// ---- admin data (lazy, cached) ----
const adminCache = {};
async function loadAdmin(a3, level){
  const key = a3 + level; if (adminCache[key]) return adminCache[key];
  const entry = (MANIFEST[a3] || {})[level] || (MANIFEST[NE_ALIAS[a3]] || {})[level];
  if (!entry) return (adminCache[key] = null);
  status(level === 'adm1' ? 'loading states and provinces…' : 'loading districts…');
  try {
    const t = await (await fetch('assets/admin/' + entry.file)).json();
    const fc = topoFeatures(t, t.objects[Object.keys(t.objects)[0]]);
    fc.features = fc.features.filter(f => f.geometry);
    fc.features.forEach((f, i) => { f.id = i; f.properties.name = f.properties.name || f.properties.shapeName || '?'; f._bbox = bbox(f); f._c = centroid(f); f.properties.pal = i % PALETTE.length; });
    fc.features.sort((a, b) => a.properties.name.localeCompare(b.properties.name));
    fc.features.forEach((f, i) => { f.id = i; });
    return (adminCache[key] = fc);
  } finally { status(''); }
}

// ---- the map ----
const map = new maplibregl.Map({
  container: 'map', style: STYLE, center: [-40, 25], zoom: 1.35, minZoom: 0.8, maxZoom: 17, maxPitch: 70,
  attributionControl: { compact: false }, canvasContextAttributes: { antialias: true },
});
window.__map = map; window.__dbg = () => ({ level: state.level, a3: state.a3, s: state.s, d: state.d, adm1: !!state.adm1, adm2: state.adm2 && state.adm2.features.length });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
map.addControl(new maplibregl.GlobeControl(), 'bottom-right');

const state = { level: 0, country: null, a3: null, adm1: null, adm2: null, adm2All: null, s: null, d: null, hover: null, hoverA: null, rotating: !reduced && params.get('spin') !== '0', idleTimer: 0,
  style: styleKey, terrainOn: params.has('terrain') ? params.get('terrain') !== '0' : (prefs.terrainOn ?? true), exag: Number(prefs.exag) || 1.3, fellBack: false, firstLoad: true };
// 3D terrain only once the view is close enough: on the globe at low zoom it shows seams, and relief is carried by the hillshade there
const TERRAIN_MIN_ZOOM = 3.5;
function applyTerrain(){
  if (!map.getSource('dem')) return;
  const want = state.terrainOn && map.getZoom() >= TERRAIN_MIN_ZOOM;
  const cur = map.getTerrain();
  if (want && (!cur || cur.exaggeration !== state.exag)) map.setTerrain({ source: 'dem', exaggeration: state.exag });
  else if (!want && cur) map.setTerrain(null);
}
function status(msg){ const el = $('#status'); el.style.display = msg ? 'block' : 'none'; el.textContent = msg || ''; }
let labelFont = ['Noto Sans Regular'];

map.on('style.load', () => {
  map.setProjection({ type: 'globe' });
  map.setSky({ 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 2.5, 0.35, 5, 0] });
  const layers = map.getStyle().layers;
  const firstSymbol = layers.find(l => l.type === 'symbol');
  const sym = firstSymbol && firstSymbol.layout && firstSymbol.layout['text-font']; if (sym) labelFont = sym;
  const firstWater = layers.find(l => l.type === 'fill' && l['source-layer'] === 'water');

  // relief
  map.addSource('dem', { type: 'raster-dem', url: TERRAIN, tileSize: 512 });
  map.addSource('dem-hill', { type: 'raster-dem', url: TERRAIN, tileSize: 512 });
  const dark = state.style === 'dark';
  // hillshade strength grows with zoom: faint on the globe (no seams), full relief when a country fills the view
  const addHills = () => map.addLayer({ id: 'hills', type: 'hillshade', source: 'dem-hill', paint: {
    'hillshade-exaggeration': ['interpolate', ['linear'], ['zoom'], 0, 0.1, 2.5, 0.22, 5, 0.5, 8, 0.6],
    'hillshade-shadow-color': dark ? '#000000' : '#3b4a3f', 'hillshade-highlight-color': dark ? '#5a6b60' : '#fbf7ea', 'hillshade-accent-color': dark ? '#1c2a22' : '#6b7d70', 'hillshade-illumination-direction': 315 } }, firstWater ? firstWater.id : undefined);
  addHills();
  applyTerrain();
  if (state.firstLoad) map.on('error', e => {
    if (e.sourceId && String(e.sourceId).startsWith('dem') && !state.fellBack){
      state.fellBack = true; console.warn('terrain source failed, falling back to AWS tiles', e.error);
      map.setTerrain(null); if (map.getLayer('hills')) map.removeLayer('hills'); map.removeSource('dem'); map.removeSource('dem-hill');
      map.addSource('dem', TERRAIN_FALLBACK); map.addSource('dem-hill', TERRAIN_FALLBACK); addHills(); applyTerrain();
    }
  });

  // countries (hover, selection, dimming)
  map.addSource('countries', { type: 'geojson', data: countries });
  map.addLayer({ id: 'country-fill', type: 'fill', source: 'countries', paint: { 'fill-color': '#d69329', 'fill-opacity': ['case', ['boolean', ['feature-state', 'selected'], false], 0, ['boolean', ['feature-state', 'hover'], false], 0.32, 0] } }, firstWater ? firstWater.id : undefined);
  map.addLayer({ id: 'country-dim', type: 'fill', source: 'countries', paint: { 'fill-color': '#0f1b15', 'fill-opacity': ['case', ['boolean', ['feature-state', 'dim'], false], 0.5, 0] } }, firstSymbol ? firstSymbol.id : undefined);
  map.addLayer({ id: 'country-line', type: 'line', source: 'countries', paint: { 'line-color': '#ffd27a', 'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 2.2, ['boolean', ['feature-state', 'hover'], false], 1.4, 0], 'line-opacity': 0.95 } }, firstSymbol ? firstSymbol.id : undefined);

  // states / provinces
  map.addSource('adm1', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'adm1-fill', type: 'fill', source: 'adm1', paint: {
    'fill-color': ['match', ['get', 'pal'], 0, PALETTE[0], 1, PALETTE[1], 2, PALETTE[2], 3, PALETTE[3], 4, PALETTE[4], 5, PALETTE[5], 6, PALETTE[6], PALETTE[7]],

    facts.innerHTML = [['Capital', c.capital], ['Population', fmt(c.population)], ['Area', c.area ? fmt(Math.round(c.area)) + ' km²' : '–'], ['Languages', (c.languages || []).join(', ') || '–']].map(([l, v]) => `<div class="fact"><div class="l">${l}</div><div class="v">${esc(v || '–')}</div></div>`).join('');
    const fc = state.adm1;
    list.innerHTML = fc ? `<div class="h">${fc.features.length} ${esc(fc.features[0]?.properties.type || 'regions')}${fc.features.length > 1 ? 's' : ''}</div>` + fc.features.map(f => `<div class="item" data-s="${f.id}"><span class="n">${esc(f.properties.name)}</span><span class="m">${esc(f.properties.iso || '')}</span></div>`).join('') : (c.a3 && (MANIFEST[c.a3] || MANIFEST[NE_ALIAS[c.a3]]) ? '<div class="h">loading…</div>' : '<div class="h">no subdivisions in the data</div>');
    legend.innerHTML = `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(c.wiki || c.name)}" target="_blank" rel="noopener">Wikipedia: ${esc(c.name)}</a>`;
  } else if (state.level === 2){
    const c = countryOf(state.country), f = state.adm1.features[state.s], p = f.properties;
    $('#eyebrow').textContent = `${esc(p.type || 'Region')} · ${esc(c.name)}`; $('#title').textContent = p.name; $('#sub').textContent = p.local && p.local !== p.name ? p.local : (p.iso || '');
    actions.innerHTML = `<button data-back="1">Back to ${esc(c.name)}</button>` + terrainBtn + exagCtl;
    facts.innerHTML = '';
    const fc = state.adm2;
    list.innerHTML = fc ? `<div class="h">${fc.features.length} districts</div>` + fc.features.map(d => `<div class="item" data-d="${d.id}"><span class="n">${esc(d.properties.name)}</span></div>`).join('') : (state.adm2All === null && state.adm2 === null && !(MANIFEST[state.a3] || {}).adm2 ? '<div class="h">no district data for this country; zoom in for towns</div>' : '<div class="h">loading districts…</div>');
    legend.innerHTML = p.wd ? `<a href="https://www.wikidata.org/wiki/${p.wd}" target="_blank" rel="noopener">Wikidata ${p.wd}</a> · <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">Wikipedia</a>` : '';
  } else {
    const f = state.adm1.features[state.s], d = state.adm2.features[state.d];
    $('#eyebrow').textContent = `District · ${esc(f.properties.name)}`; $('#title').textContent = d.properties.name; $('#sub').textContent = 'Towns and cities visible on the map right now. Zoom in for more.';
    actions.innerHTML = `<button data-back="2">Back to ${esc(f.properties.name)}</button>` + terrainBtn + exagCtl;
    facts.innerHTML = '';
    const towns = visibleTowns();
    list.innerHTML = towns.length ? `<div class="h">${towns.length} places in view</div>` + towns.map((t, i) => `<div class="item" data-t="${i}"><span class="n">${esc(t.name)}</span><span class="m">${esc(t.cls)}</span></div>`).join('') : '<div class="h">no town labels in view yet; zoom in a little</div>';
    list.querySelectorAll('.item[data-t]').forEach(el => el.onclick = () => { const t = towns[Number(el.dataset.t)]; map.flyTo({ center: t.lngLat, zoom: Math.max(map.getZoom(), t.cls === 'city' ? 11 : 12.5), duration: reduced ? 0 : 1200 }); });
    legend.innerHTML = `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(d.properties.name)}" target="_blank" rel="noopener">Wikipedia: ${esc(d.properties.name)}</a>`;
  }
  const tb = $('#terrainBtn'); if (tb) tb.onclick = () => { state.terrainOn = !state.terrainOn; savePrefs(); applyTerrain(); renderSide(); };
  const ex = $('#exag'); if (ex) ex.oninput = () => { state.exag = Number(ex.value); ex.nextElementSibling.textContent = state.exag.toFixed(1) + '×'; applyTerrain(); savePrefs(); };
  actions.querySelectorAll('[data-style]').forEach(b => b.onclick = () => setStyle(b.dataset.style));
  const rb = $('#rotateBtn'); if (rb) rb.onclick = () => { state.rotating = !state.rotating; rb.classList.toggle('on', state.rotating); clearTimeout(state.idleTimer); };
  actions.querySelectorAll('[data-back]').forEach(b => b.onclick = () => backTo(Number(b.dataset.back)));
  list.querySelectorAll('.item[data-a3]').forEach(el => el.onclick = () => { const c = byA3[el.dataset.a3]; const f = c && countries.features.find(x => x.properties.ccn3 === c.ccn3); if (f) selectCountry(f.id); });
  list.querySelectorAll('.item[data-s]').forEach(el => el.onclick = () => selectState(Number(el.dataset.s)));
  list.querySelectorAll('.item[data-d]').forEach(el => el.onclick = () => selectDistrict(Number(el.dataset.d)));
  list.querySelectorAll('.item').forEach(el => el.onmouseenter = () => { if (el.dataset.s != null) setHover('adm1', Number(el.dataset.s)); if (el.dataset.d != null) setHover('adm2', Number(el.dataset.d)); });
}

// ---- deep links: #c=IND&s=Maharashtra&d=Mumbai%20Suburban ----
function writeHash(){
  if (state.level === 0){ history.replaceState(null, '', location.pathname + location.search); return; }
  const h = new URLSearchParams(); h.set('c', state.a3 || '');
  if (state.level >= 2 && state.adm1) h.set('s', state.adm1.features[state.s].properties.name);
  if (state.level >= 3 && state.adm2) h.set('d', state.adm2.features[state.d].properties.name);
  history.replaceState(null, '', '#' + h.toString());
}
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1)); const a3 = (h.get('c') || '').toUpperCase();
  if (a3 && byA3[a3]){ const f = countries.features.find(x => x.properties.ccn3 === byA3[a3].ccn3); if (f) selectCountry(f.id, { s: h.get('s'), d: h.get('d') }); }
}
window.addEventListener('hashchange', readHash);

// ---- search: countries, states, cities, physical and marine names (gazetteer built by globe_data.py) ----
let GAZ = null, gazPromise = null, results = [], cursor = -1;
const KIND_LABEL = { country: 'country', admin1: 'state / province', city: 'city', physical: 'landform', marine: 'sea / ocean' };
const KIND_ORDER = { country: 0, admin1: 1, city: 2, marine: 3, physical: 4 };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function loadGaz(){ return gazPromise || (gazPromise = fetch('assets/data/gazetteer.json').then(r => r.json()).then(rows => { rows.forEach(r => r.n = norm(r[1])); GAZ = rows; return rows; })); }
function search(q){
  const nq = norm(q.trim()); if (!nq || !GAZ) return [];
  const starts = [], contains = [];
  for (const r of GAZ){ if (r.n.startsWith(nq)) starts.push(r); else if (nq.length >= 3 && r.n.includes(nq)) contains.push(r); if (starts.length > 400) break; }
  const score = r => KIND_ORDER[r[0]] * 10 + (r[0] === 'city' ? Math.min(9, r[6] ?? 9) : 0) + (r[0] === 'physical' || r[0] === 'marine' ? Math.min(9, r[6] ?? 9) : 0);
  return [...starts.sort((a, b) => score(a) - score(b) || a[1].length - b[1].length), ...contains.sort((a, b) => score(a) - score(b))].slice(0, 12);
}
function where(r){
  const c = r[4] && byA3[r[4]];
  if (r[0] === 'country') return r[5] ? `capital ${r[5]}` : '';
  if (r[0] === 'admin1') return c ? c.name : (r[5] || '');
  if (r[0] === 'city') return [r[5], c && c.name].filter(Boolean).join(', ');
  return r[5] ? String(r[5]).replace(/_/g, ' ').toLowerCase() : '';
}
function renderResults(){
  const el = $('#results');
  if (!results.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = results.map((r, i) => `<div class="r${i === cursor ? ' on' : ''}" data-i="${i}" role="option"><span class="n">${r[0] === 'country' && byA3[r[4]] ? (byA3[r[4]].flag || '') + ' ' : ''}${esc(r[1])}</span><span class="k"><b>${KIND_LABEL[r[0]] || r[0]}</b>${where(r) ? ' · ' + esc(where(r)) : ''}</span></div>`).join('');
  el.style.display = 'block';
  el.querySelectorAll('.r').forEach(d => { d.onmousedown = e => e.preventDefault(); d.onclick = () => goTo(results[Number(d.dataset.i)]); });
}
async function goTo(r){
  $('#q').value = r[1]; results = []; cursor = -1; renderResults(); $('#q').blur();
  const a3 = r[4]; const c = a3 && byA3[a3]; const countryFeature = c && countries.features.find(x => x.properties.ccn3 === c.ccn3);
  if (r[0] === 'country' && countryFeature){ selectCountry(countryFeature.id); return; }
  if (r[0] === 'admin1' && countryFeature){ await selectCountry(countryFeature.id, { s: r[1] }); if (state.level < 2) map.flyTo({ center: [r[2], r[3]], zoom: 5.5, duration: reduced ? 0 : 1400 }); return; }
  if (r[0] === 'city'){
    if (countryFeature){ await selectCountry(countryFeature.id, { s: r[5] || undefined }); }
    // the state's districts load asynchronously; give them a moment, then drill into the one holding the city
    for (let t = 0; t < 30 && state.level === 2 && !state.adm2; t++) await new Promise(res => setTimeout(res, 100));
    if (state.level >= 2 && state.adm2){ const k = state.adm2.features.findIndex(d => inFeature(d, [r[2], r[3]])); if (k >= 0) selectDistrict(k); }
    map.flyTo({ center: [r[2], r[3]], zoom: (r[6] ?? 9) <= 2 ? 9.5 : 11, duration: reduced ? 0 : 1800 });
    $('#hint').textContent = `${r[1]}: zoom in for streets, rivers and peaks`;
    return;
  }
  // physical or marine feature: fly there at a scale that fits its rank, leave the globe level alone
  const rank = r[6] ?? 5; const zoom = rank <= 1 ? 2.2 : rank <= 3 ? 3.2 : rank <= 5 ? 4.5 : 6;
  if (state.level > 0) backTo(0);
  state.rotating = false; clearTimeout(state.idleTimer);
  map.flyTo({ center: [r[2], r[3]], zoom, duration: reduced ? 0 : 1800 });
  $('#hint').textContent = `${r[1]} (${KIND_LABEL[r[0]]})`;
}
const q = $('#q');
q.addEventListener('focus', () => { loadGaz().then(() => { if (q.value) { results = search(q.value); renderResults(); } }); });
q.addEventListener('input', async () => { await loadGaz(); results = search(q.value); cursor = results.length ? 0 : -1; renderResults(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ cursor = Math.min(results.length - 1, cursor + 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ cursor = Math.max(0, cursor - 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'Enter'){ if (results[cursor]) goTo(results[cursor]); else if (results[0]) goTo(results[0]); }
  else if (e.key === 'Escape'){ results = []; renderResults(); q.blur(); }
});
q.addEventListener('blur', () => setTimeout(() => { results = []; renderResults(); }, 150));
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); } });
</script>
